<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Marksman class emblem">
  <!-- ORIGINAL code-drawn emblem (WoS Battle Simulator shell). Generic fletched
       arrow over a ring reticle, ice/survival theme. Not derived from any
       Century Games artwork. Palette: prototype/DESIGN_SYSTEM.md tokens. -->
  <defs>
    <linearGradient id="mrk-field" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#164A72"/>
      <stop offset="1" stop-color="#0B273D"/>
    </linearGradient>
    <linearGradient id="mrk-tip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EAF6FF"/>
      <stop offset="1" stop-color="#2EA1F2"/>
    </linearGradient>
  </defs>
  <!-- reticle field -->
  <circle cx="32" cy="32" r="28" fill="url(#mrk-field)" stroke="#5AAEF3" stroke-width="2.5"/>
  <circle cx="32" cy="32" r="17" fill="none" stroke="#B9D2E5" stroke-opacity="0.45" stroke-width="1.4"/>
  <!-- reticle ticks -->
  <g stroke="#B9D2E5" stroke-opacity="0.7" stroke-width="2" stroke-linecap="round">
    <line x1="32" y1="6.5" x2="32" y2="12.5"/>
    <line x1="32" y1="51.5" x2="32" y2="57.5"/>
    <line x1="6.5" y1="32" x2="12.5" y2="32"/>
    <line x1="51.5" y1="32" x2="57.5" y2="32"/>
  </g>
  <!-- arrow, lower-left to upper-right -->
  <g transform="rotate(-45 32 32)">
    <rect x="15" y="30.8" width="27" height="2.4" rx="1.2" fill="#B9D2E5"/>
    <!-- head -->
    <path d="M42 27.5 L51 32 L42 36.5 L44.2 32 Z" fill="url(#mrk-tip)" stroke="#1682D8" stroke-width="0.8" stroke-linejoin="round"/>
    <!-- fletching -->
    <path d="M15 27 L20.5 30.8 L15.5 30.8 L11.5 28.2 Z" fill="#EF5F5F"/>
    <path d="M15 37 L20.5 33.2 L15.5 33.2 L11.5 35.8 Z" fill="#EF5F5F"/>
  </g>
  <!-- centre pip -->
  <circle cx="32" cy="32" r="2.2" fill="#EAF6FF"/>
</svg>
