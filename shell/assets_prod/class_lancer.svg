<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Lancer class emblem">
  <!-- ORIGINAL code-drawn emblem (WoS Battle Simulator shell). Generic diagonal
       lance with icicle head + pennant, ice/survival theme. Not derived from
       any Century Games artwork. Palette: prototype/DESIGN_SYSTEM.md tokens. -->
  <defs>
    <linearGradient id="lan-ring" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#164A72"/>
      <stop offset="1" stop-color="#0B273D"/>
    </linearGradient>
    <linearGradient id="lan-head" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EAF6FF"/>
      <stop offset="0.5" stop-color="#55BFFF"/>
      <stop offset="1" stop-color="#1682D8"/>
    </linearGradient>
  </defs>
  <!-- roundel field -->
  <circle cx="32" cy="32" r="28" fill="url(#lan-ring)" stroke="#5AAEF3" stroke-width="2.5"/>
  <circle cx="32" cy="32" r="23.5" fill="none" stroke="#B9D2E5" stroke-opacity="0.35" stroke-width="1.2"/>
  <!-- lance shaft, lower-left to upper-right -->
  <rect x="16" y="30.4" width="30" height="3.2" rx="1.6" fill="#B9D2E5"
        transform="rotate(-45 32 32)"/>
  <!-- icicle lance head -->
  <path d="M52.5 11.5 L49.6 22.2 L45.5 18.1 L41.8 22.2 L38.6 19 L42.7 15.3 L38.6 11.2 49.4 8.4 Z"
        transform="translate(-3.5 3.5)" fill="url(#lan-head)" stroke="#1682D8" stroke-width="1" stroke-linejoin="round"/>
  <!-- pennant near the grip -->
  <path d="M18 40 L28 42.6 L20.6 47.4 Z" fill="#EF5F5F" stroke="#C94646" stroke-width="1" stroke-linejoin="round"/>
  <!-- butt cap -->
  <circle cx="15.5" cy="48.5" r="2.6" fill="#EAF6FF"/>
</svg>
