# shell/docker-compose.yml — app + Caddy TLS front (Agent A).
# Run from shell/:  docker compose up -d --build
# Put real keys in shell/.env (copy .env.example). Staging runs the same file
# as a second stack with its own .env (ENV=staging) per PRODUCTION_PLAN §2.1.
#
# F28 (EVAL_ROUND_1.md, minor): cheap hardening for a single-VPS deployment —
# mem_limit/cpus bound one runaway container, no-new-privileges blocks
# privilege escalation via setuid binaries. (The Dockerfile itself now also
# drops to a non-root user before CMD, F28's other half.) read_only root
# filesystem is deliberately NOT enabled here — it needs verifying against a
# real container boot (PIL/rapidocr temp-file usage unconfirmed) that this
# keyless, no-docker-daemon environment cannot do; left for a follow-up with
# that verification.
services:
  app:
    build:
      context: ..                 # repo root — Dockerfile copies wos_sim/ + prototype/ + shell/
      dockerfile: shell/Dockerfile
    env_file: .env
    restart: unless-stopped
    expose:
      - "8200"
    mem_limit: 1g
    cpus: 2.0
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8200/shell/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data          # auto-TLS certificates persist here
      - caddy_config:/config
    depends_on:
      - app

volumes:
  caddy_data:
  caddy_config:
